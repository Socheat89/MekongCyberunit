services:
  oracle:
    image: socheat29/oracle:slim
    container_name: is405_oracle
    restart: unless-stopped
    environment:
      - ORACLE_PASSWORD=123
      - ORACLE_DATABASE=XEPDB1
    ports:
      - "3333:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      - is405_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: socheat29/backend:latest
    container_name: is405_backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - DatabaseProvider=Oracle
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/is405.db
      - ConnectionStrings__OracleConnection=Data Source=oracle:1521/XEPDB1;User Id=system;Password=123;
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5000:5000"
      - "5230:5000"
    volumes:
      - backend_data:/app/data
    depends_on:
      - oracle
    networks:
      - is405_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: socheat29/frontend:latest
    container_name: is405_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "4200:80"
    depends_on:
      - backend
    networks:
      - is405_network

volumes:
  backend_data:
    name: is405_sqlite_data
  oracle_data:
    name: is405_oracle_data

networks:
  is405_network:
    name: is405_network
    driver: bridge
